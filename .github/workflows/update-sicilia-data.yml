name: Aggiorna rischio da caldo Sicilia

on:
  schedule:
    # 05:30 UTC = 07:30 CEST (ora legale, mar-ott) — prima della fascia di rischio 12-16
    - cron: '30 5 * * *'
    # 06:30 UTC = 07:30 CET (ora solare, nov-mar)
    - cron: '30 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-sicilia-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica orario italiano previsto (mattina, gestisce CET/CEST + delay scheduler)
        id: check-ora
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub Actions puo' ritardare i cron scheduled anche di 1h+; l'unico
          # vincolo reale e' arrivare prima della fascia di rischio 12-16, non
          # centrare le 7:30 esatte (che faceva saltare il run in silenzio nei
          # giorni di ritardo). Il guard "gia_fatto" sotto evita i doppi run nei
          # giorni in cui entrambi i cron (CET/CEST) cadono entro mezzogiorno.
          ora=$(TZ=Europe/Rome date +%-H)
          oggi=$(TZ=Europe/Rome date +%F)
          if [ "$ora" -ge 12 ]; then
            echo "Ora locale Italia: $ora, dopo mezzogiorno. Skip run." >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gia_fatto=$(node -e "try{const d=require('./data/rischio-oggi.json');process.stdout.write(d.generatedAt==='$oggi'?'1':'0')}catch{process.stdout.write('0')}")
          if [ "$gia_fatto" = "1" ]; then
            echo "Dato di oggi ($oggi) gia' presente, skip run duplicato." >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check-ora.outputs.run == 'true'
        with:
          node-version: 20

      - name: Aggiorna dati rischio (data/rischio-oggi.json)
        if: steps.check-ora.outputs.run == 'true'
        run: node scripts/update-data.mjs

      - name: Commit e push se cambiato
        if: steps.check-ora.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/rischio-oggi.json data/storico-rischio.csv; then
            echo "Nessuna modifica, skip commit."
            exit 0
          fi
          git add data/rischio-oggi.json data/storico-rischio.csv
          git commit -m "Aggiorna rischio da caldo Sicilia $(date -u +%Y-%m-%d)"
          git push
